[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmdm"
version = "0.1.0"
description = "Open-source, Python-native Customer Master Data Management for insurance data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# The model registry itself is pure standard library and stays that way. It is
# imported by ingestion workers, the API server and schema-generation scripts,
# and none of them should be made to install Arrow just to learn what a column
# means. Everything below is for the layers built on top of it.
dependencies = []

[project.optional-dependencies]
# Vectorized layer: Arrow-backed column operations for normalization, blocking,
# comparator scoring and survivorship.
#
# scipy and numpy are here rather than in an extra of their own because
# resolve/clustering.py imports them at module scope -- the transitive closure
# is resolved by connected components over a sparse adjacency matrix, and there
# is no vectorized path without it. They were undeclared until an offline
# install was attempted, which is the first thing that actually checks.
vector = [
    "pyarrow>=16",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
]

# ACID golden store. The pool is a separate distribution from psycopg itself
# and db/engine.py imports it at module scope, so it is named explicitly
# rather than hoped for.
store = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

# API server, and the Prometheus exposition /metrics renders.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

# A convenient way to get PostgreSQL binaries onto a development machine.
#
# NOT how the offline bundle does it. pgserver publishes wheels only for
# CPython 3.9-3.12, and a database engine has no business constraining which
# interpreter the system runs on -- so the bundle ships the PostgreSQL
# installation as plain files and cmdm.embedded drives initdb and pg_ctl
# directly. This extra exists because `pip install` is still the easiest way to
# obtain those files when you do have an index.
embedded = [
    "pgserver>=0.1.4; python_version < '3.13'",
]

# Local open-source models for the fallback path, invoked only on the undecided
# band. Optional in the strongest sense: with no model file present both AI
# paths fall back to their reference implementations, which are pure Python,
# and onnxruntime is never imported.
ai = [
    "onnxruntime>=1.18",
]

dev = [
    "pytest>=8.0",
    "pglast>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Everything the system actually needs to run.
all = [
    "cmdm[vector,store,api]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cmdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warns that it prefers httpx2 over httpx. Nothing
    # here can act on it: the bundle ships the closure pip resolved, and the
    # warning is about a dependency of a dependency used only by tests. Left
    # visible it prints a four-line block in the middle of every run, which
    # trains people to read past output that is meant to be read.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cmdm"]
